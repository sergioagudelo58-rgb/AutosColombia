<div class="page-shell">
  <header class="site-header">
    <a class="brand" routerLink="/" aria-label="Autos Colombia, inicio">
      <span class="brand-mark" aria-hidden="true">AC</span><span>Autos Colombia</span>
    </a>
    @if (menu().length) {
      <nav aria-label="Navegación principal">
        @for (o of menu(); track o.ruta) {
          <a [routerLink]="o.ruta" routerLinkActive="active" ariaCurrentWhenActive="page">{{
            o.texto
          }}</a>
        }
      </nav>
    }
    @if (auth.sesion(); as s) {
      <div class="cuenta">
        <span class="turno-chip" title="Usuario, perfil y puerta de la sesión"
          >{{ s.nombre }} · {{ nombreRol[s.rol] }}{{ s.puerta ? ' · ' + s.puerta : '' }}</span
        >
        @if (!auth.debeCambiarClave()) {
          <a class="enlace" routerLink="/cambiar-contrasena">Contraseña</a>
        }
        <button type="button" class="salir" (click)="auth.logout()">Cerrar sesión</button>
      </div>
    }
  </header>
  <main><router-outlet /></main>
  <footer><span>Autos Colombia</span><span>Control vehicular con claridad.</span></footer>
</div>
